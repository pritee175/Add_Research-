g kills. Smoking causes cancer and kills. Liquid drinking is injurious to health. Alcohol consumption causes harm to health."], ["43.2", "Ready-made Shinen 8.3 FM."], ["66.1", "எனக்கு ராகம் கேட்டிருக்கீங்க அண்ணா உங்க ஆர்ஜே கலக்கல் கல்யாணி. இந்தாடா பிஸ்கட் எடுத்துக்க. பிஸ்கட்லாம் வாங்கல. நாளைக்கு தான் உங்க பர்த்டேல ட்ரீட் வச்சிருக்கேன். சிகரெட்லாம் எப்படா குடிக்கிறீங்க? அந்த டப்பால போட்டிருக்க போட்டோவை பார்த்து கூடடா உங்களுக்கு குடிக்க தோணுது."], ["89.8", "தெரிஞ்சுதான் தொலைங்கல.\nஉனக்கு என்னடா? இன்னைக்கு கூட தான் மேனேஜ்மென்ட்ல இருந்தேன்டா. நான் கேக்குறேன்.\nகாலையில பாருடா.\nஒரு ஹீரோயின் மாதிரி இருக்குடா.\nமெடிக்கல் ஷாப்ப போய் டேப்லெட் வாங்கிட்டு வந்துடறேன். சரி போயிட்டு வா."], ["104.3", "Hello."], ["119.2", "ஹலோ எஃப்எம் 106.4. ஏய் தலை ரொம்ப வலிக்கிற மாதிரி இருக்குடா. சரி இப்ப ரெஸ்ட் எடு நாளைக்கு பார்க்கலாம்."], ["191.1", "என்னடா ஆச்சு? நைட்ல இருந்து ஒரே காய்ச்சல் தான் இருக்குடா. என்னடா உடம்பு இப்படி சுடுது? என் உடம்பு வேற ரொம்ப வலிக்குதுடா. சரி வாடா ஹாஸ்பிடல் போலாம் கிளம்பு."], ["213.8", "பார்த்து பொறுமையாக எழுந்துடுறா."], ["232.7", "என் ஃப்ரெண்டுக்கு என்னாச்சு டாக்டர்?"], ["256.8", "லேட்டஸ்ட் லேப் அனுப்பிச்சிருக்கோம், ரிசல்ட் வரட்டும்.\nஎதனால டாக்டர் இது மாதிரி வருது?\nநீங்க தூக்கி போடுற கொட்டாங்குச்சி அப்புறம் சாக்கடையில தேங்கி நிக்கிற தண்ணில உற்பத்தி ஆகுற கொசு தான் வந்து மலேரியா, டெங்கு இந்த மாதிரி நோய்கள் எல்லாம் பரவிட்டு இருக்கு.\nஇப்ப ஏதாவது உங்களுக்கு வந்து காய்ச்சல் வந்துச்சுன்னா நீங்க டைரக்டா மெடிக்கல் ஷாப் போய் மாத்திரை வாங்காதீங்க.\nடாக்டர் வந்து கன்சல்ட் பண்ணுங்க.\nஇதனால அல்சர், கிட்னி ஃபெயிலியர் அந்த மாதிரி டிசீஸ் எல்லாம் வரும்.\nஇதுக்காக தான் கம்யூனிட்டி மெடிசின் டிபார்ட்மெண்ட்ல இருக்க டாக்டர்..."], ["281.8", "வந்து ஃபீல்ட் விசிட் போய் அங்க இருக்கிற பப்ளிக்லாம் அவேர்னஸ் கிரியேட் பண்றாங்க சார்."], ["300.7", "ਖਾਣਾ ਵਾ।"], ["343.2", "Hello."], ["367.6", "என்ன மச்சான்ச்சு?\nஎன்னன்னே தெரியலடா. நைட் ஃபுல்லா இருமிட்டே இருந்தான். காய்ச்சல் வேற இருந்துச்சு. இங்க கூட்டிட்டு வந்தோம் உடனே அட்மிட் பண்ண சொல்லிட்டாங்க.\nஎன்ன சார் டாக்டர்?\nஇவருக்கு டிபிங்க."], ["391.6", "டாக்டர் இவனுக்கு சிகரெட் தண்ணின்னு எந்த கெட்ட பழக்கமும் இல்ல அப்புறம் எப்படி?\nஇவர்தான் ஸ்மோக் பண்ணனும்னு அவசியம் இல்லங்க. ஸ்மோக் பண்ணும்போது பக்கத்துல இருந்தாலே போதும்.\nடாக்டர் இந்த மாதிரி இதுக்கு முன்னாடி யாருக்காச்சும் வந்திருக்கா?\nநிறைய பேருக்கு வந்திருக்குங்க. எங்க ஊர்ல கூட ஒருத்தர் 20 வருஷமா டீ கடை வச்சிட்டு இருந்தாரு. அவருக்கும் ஆனா எந்த கெட்ட பழக்கமும் இல்ல. ஆனா அவருக்கும் இந்த மாதிரி பிரச்சனைகள் இருக்கு செகண்ட் ஹேண்ட் ஸ்மோக்கிங்னால.\nசெகண்ட் ஹேண்ட் ஸ்மோக்கிங்னா என்னங்க டாக்டர்?\nமத்தவங்க ஸ்மோக் பண்ணும்போது அவங்க சிகரெட்ல இருந்து வர..."], ["416.6", "புகை இருக்குல்லங்க, அத நம்ம சுவாசிச்சோம்னா, அதனால வர விளைவுல தான் செகண்ட் ஹேண்ட்ஸ் ஓகே.\nஇவ்ளோ நேரம் சொன்னேன்லங்க, ஒரு டீ கடைக்காரர் வரீங்க பாருங்க.\nநீங்க உங்களுக்குள்ள தெரிஞ்ச டிரஸ் அந்த மாதிரி நிறைய விஷயம் ஷேர் பண்றீங்கல்லங்க, ஆனா உங்களுக்கே தெரியாம நீங்க நிறைய நோய்களை பரப்புறீங்க, பாத்துருந்தீங்க."], ["436.2", "தெரியல என்னாச்சு? டாக்டர் கூப்பிடுங்க. டாக்டர். சாரி இறந்துட்டாங்க."], ["454.0", "Time of death 11:49 PM."], ["494.5", "அம்மா அம்மா நீ எந்த அம்மா உன்ன விட்டா எனக்கு ஆறு அம்மா நீ அட்டென்ட் பண்ற ஹலோ."], ["507.9", "ஹாப்பி பர்த்டேப்பா, நீ ரொம்ப நாளா கேட்டுட்டு இருந்த பைக் உங்க அப்பா வாங்கிட்டாரு. நாளைக்கு நானும் உங்க அப்பாவும் உன்ன பாக்க வரோம். அவங்க வீட்டுக்கு சொல்லிடலாம்டா. ஆமாண்டா, வாங்க போய் ஆக வேண்டிய வேலைய பாக்கலாம்."], ["543.0", "Stop smoking. Stop smoking. Stop smoking. Stop smoking. Hindu video paathuttu."], ["568.0", "Like pannalainna anti Indian. Share pannalainna anti Indian. Comment pannalainna you are anti Indian. Subscribe pannalainna anti Indian. Bell symbol amukkalainna anti Indian. Idhai download panni vera channel-la potta anti Indian."]], "screen": [["0.0", "other", "HEALTH ADVISORY"], ["0.0", "warning", "SMOKING CAUSE CANCER - SMOKING KILLS! / புகை பிடிப்பது புற்று நோயை உண்டாக்கும் மற்றும் உயிரை கொல்லும்"], ["0.0", "warning", "LIQUOR DRINKING IS INJURIOUS TO HEALTH / மது அருந்துதல் உடல்நலத்திற்கு கேடுவிளைவிப்பதாகும்"], ["19.3", "credit", "MEDIA PARTNER"], ["19.3", "brand", "BE LIK S[x.id]={lab:v('lab'),conf:v('conf'),why:document.getElementById('why').value};save();list()}
function go(d){cur=Math.max(0,Math.min(D.length-1,cur+d));show()}
function exp(){const q=t=>'"'+String(t).replace(/"/g,'""')+'"';
const r=['ad_id,annotator_id,chosen_label,confidence,reason,agreed_flag,final_label,adjudicator_id'];
D.forEach(x=>{const s=S[x.id];if(s&&s.lab)r.push([x.id,'human1',s.lab,s.conf,q(s.why),'','',''].join(','))});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.join('\n')],{type:'text/csv'}));a.download='annotators_human1.csv';a.click()}
show();
</script></body></html>
