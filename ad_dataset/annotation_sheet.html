communities."], ["73.2", "Additionally, the portrayal of tobacco use today has made it a socially acceptable and attractive behavior.\nThe Government of India continues to take decisive action and enact measures at local, national, regional, and global levels that are designed to consistently and significantly diminish the prevalence of tobacco use and exposure to tobacco smoke, thereby fostering..."], ["98.1", "healthier communities. India stringently enforces the WHO Framework Convention on Tobacco Control, which has yielded noticeable results as witnessed by our excellent tobacco surveillance and monitoring mechanisms. Empowering the citizens of the country, especially the youth, to shield themselves from the harmful effects of tobacco production and consumption and raising awareness."], ["122.9", "about its public health consequences are paramount priorities for the Government of India as we strive to achieve a nation free from the tobacco epidemic.\nI am pleased to announce the key focus area for tobacco control initiatives in 2024.\nThese include strict enforcement of India's National Tobacco Control Law, COTC..."], ["147.5", "2003. Intensified public awareness campaigns, increasing tobacco-free educational institutions, and establishing tobacco-free villages nationwide. I commend all stakeholders for their substantial contributions to tobacco control. The Ministry of Health and Family Welfare remains resolute in its aim to safeguard both current."], ["172.0", "and future generations from the profound health, social, environmental, and economic harms associated with tobacco. My best wishes to all on the World No Tobacco Day and my best wishes to all concerned so that this message is spread far and wide and our youth and the entire population is saved from the scourge of tobacco. Thank you."]], "screen": [["0.0", "brand", "स्वास्थ्य एवं परिवार कल्याण मंत्रालय MINISTRY OF HEALTH AND FAMILY WELFARE"], ["0.0", "tagline", "WORLD NO TOBACCO DAY 31st May"], ["9.0", " ल जो कैंसर से पीड़ित है।\nपहले बीड़ी पीता था तो ऐसा मालूम नहीं था कि क्या असर हो जाएगा। अभी तो ठीक हो जाएंगे तो अच्छा होगा। शिक्षण छोड़ दिया मेरी वजह से मेरे बच्चे ने। वो इंजीनियर का कल आ गया था उनको। तो मेरे इलाज पे आ गया तो उनका इलाज हो गया।"], ["41.5", "स्कूल बंद हो गया। स्कूल बंद हो गया।\nमेरा लड़का जब बीमारी नहीं आती थी तो इंजीनियर होने वाला था अभी।\nअब हमारी गरीबी चली जाने वाली थी ना वो इंजीनियर बनने वाला था तो।\nकब तक काम करेंगे हम अकेले अब।\nतंबाकू का दायरा सिर्फ बड़ों तक ही सीमित नहीं है।"], ["66.5", "बल्कि अब कम उम्र के बच्चों को भी ये अपने अंदर समेट रहा है।\nमेरा नाम पूनम है और 7 साल की हूँ। मैं कैटलोप का खाती हूँ।\nबचपन में लगी इस बुरी आदत का नुकसान भविष्य में भुगतना ही पड़ता है। और जब तक ये बात हमें समझ आती है, बहुत देर हो चुकी होती है।"], ["90.1", "बचपन में फ्रेंड फ्रेंड के साथ आदत लग गई थी। अभी मेरे को एक्चुअली मालूम ही नहीं था कि मेरे को कम इतने कम उम्र में ऐसा प्रॉब्लम हो जाएगा। मैंने इस बारे में सोचा ही नहीं कभी। तंबाकू चबाने से होने वाला कैंसर बहुत छोटी उम्र में भी हो सकते हैं। इस युवती को तंबाकू चबाने से सिर्फ एक साल में मुँह का कैंसर हो गया है और ये सिर्फ सतह।"], ["115.1", "25 उम्र की है।\nधूम्रपान आपकी जिंदगी के 10 साल कम कर देता है।\nतंबाकू किसी भी रूप में लिया जाए उससे कैंसर होता है।\nसिगरेट, बीड़ी, पान, जर्दा, खैनी, मावा या चबाने वाला पान जो कि लोग इस्तेमाल करते हैं, इन सब से जो कैंसर होता है कितना भयानक होता है और उससे..."], ["140.1", "कितनी बर्बादी होती है उसका आप अंदाजा भी नहीं लगा सकते हैं।\nभारत में लगभग 27,50,00,000 लोग तंबाकू का सेवन करते हैं।\n15 वर्ष से ज्यादा उम्र में 35% युवा किसी न किसी रूप में तंबाकू का सेवन करते हैं।\nधूम्रपान से निकलने वाला धुआं धूम्रपान ना करने वालों पर भी..."], ["162.5", "शारीरिक, मानसिक और आर्थिक रूप से असर करता है। तंबाकू की वजह से बच्चे हो या जवान, कई तरह की बीमारियों का शिकार हो सकते हैं, जिनमें अकस्मात मृत्यु, निमोनिया, अस्थमा, हृदय तथा फेफड़ों की बीमारी शामिल है। 25 मई 2000।"], ["186.5", "11 को पता चला हमें कि इनको कैंसर है बायोप्सी रिपोर्ट के अनुसार।\nये सब जिसको भी अब मैं खाते हुए किसी को भी देखता हूँ तो बहुत दुख लगता है मैं उसे मना भी करता हूँ तो वो मज़ाक में खेल कर कहता है कि अरे ये सब कुछ नहीं होता है इस तरह से टाल दिया जाता है।\nप्रतिवर्ष तंबाकू की वजह से 10,00,000 से भी ज़्यादा लोगों की मौत होती है।\nवो क्या करती थी तंबाकू की मसेरी लगा देती थी मुंजन।"], ["211.4", "उनको अभी डॉक्टर ने बोला कैंसर हो गए।\nप्रति 10 में से 1 मौत का कारण धूम्रपान होता है।\nमैंने 16 साल की उम्र में 1966 में सिगरेट पीना शुरू किया।\nमेरा जो सांस लेने की नली है उसको निकाल दिया गया है।\nमेरी गर्दन में एक होल किया हुआ है।"], ["236.4", "जिसके थ्रू मैं सांस लेता हूं। जिंदगी खूबसूरती के साथ जीने के लिए है ना कि बर्बाद करने के लिए। तंबाकू से दूर रहकर अपना और आने वाली पीढ़ियों का भविष्य सुरक्षित रखें।"], ["257.1", "देश को तंबाकू मुक्त बनाएं।"]], "screen": [["3.1", "other", "Tobacco Free advocacy Film / World Lung Foundation / Language : Hindi / Total Run Time : 04 Minutes 35 Seconds"], ["25.1", "credit", "Jeta Singh Rathore (54 years) / Patient (Throat Cancer) / Bidi Smoker"], ["47.0", "credit", "Jaywanti Rathore / Jeta Singh's Wife"], ["94.0", "credit", "Nilesh Akrekar (37 years) / Patient (Oral Cancer) / Tobacco Chewer"], ["106.5", "credit", "Dr. Caleb Harr"], ["115.9", "credit", "Rekha (27 years) / Patient (Oral Cancer) / Tobacco Chewer"], ["125.3", "credit", "Dr. Pankaj Chaturvedi / Tata Memorial Hospital (Mumbai)"], ["147.3", "other", "THERE ARE 27.5 CRORES TOBACCO USERS IN INDIA"], ["150.4", "other", "35% ADULTS OF AGE 15+ USE SOME FORM OF TOBACCO"], ["175.5", "other", "Sudden Infant Death / Asthma"], ["178.6", "other", "Pneumonia / Lung diseases / Heart Attacks"], ["181.7", "other", "Strokes / Cancer"], ["188.0", "credit", "Vinay Kumar Dixit (28 years) / Patient (Oral Cancer) / Tobacco Chewer"], ["203.7", "other", "MORE THEN 10 LAKH LIVES ARE LOST EACH YEAR"], ["206.8", "credit", "Sharmila Santosh Kalsekar (39 years) / Patient (Throat Cancer) / Tobacco Chewer"], ["209.9", "other", "DENTAL CARE PRODUCTS CONTAINING TOBACCO / ( e.g., Masheri, Gul, Gadhaku ) / CAN CAUSE CANCER"], ["219.3", "other", "1 IN 10 DEATHS IS CAUSED BY SMOKING"], ["225.6", "credit", "Deepak Kumar (63 years) / Patient (Throat Cancer) / Cigarette Smoker"], ["260.1", "tagline", "TOBACCO KILLS"], ["260.1", "tagline", "Make India Tobacco Free"], ["263.2", "brand", "WORLD LUNG FOUNDATION"], ["266.3", "credit", "Thanks to / The victims and the families who shared their stories."], ["269.5", "credit", "In Collaboration with / Voice of Tobacco Victims ( VOTV ) / Healis / ( a project by Healis - Sekshsaria Institute for Public Health )"], ["272.6", "credit", "We Gratefully Acknowldge / Tata Memorial Hospital, Mumbai / Special Thanks To : / Dr. Badwe / Dr. Pankaj Chaturvedi"], ["275.7", "credit", "Acknowledgements / Bloomberg Philanthropies / Campaign for Tobacco Free Kids / The International Union Against Tuberculosis and Lung Disease / World Health Organization / Centers for Disease Control and Prevention / Framework Convention Alliance / Johns Hopkins University School of Public Health"], ["278.9", "credit", "WORLD LUNG FOUNDATION / Vaishakhi Mallik / Sandra Mullin / Nandita Murukutla / Rebecca Perl / Tahir Turk"]]}, {"id": "B_0027", "video": "videos/B_0027.mp4", "dur": "unknown", "cat": "tobacco", "brand": "not_applicable", "shown": "cigarette_smoking", "implied": "not_applicable", "warn": "unknown", "speech": [["0.0", "Smoking causes cancer. Smoking kills. Smoking causes cancer and kills. Liquid drinking is injurious to health. Alcohol consumption causes harm to health."], ["43.2", "Ready-made Shinen 8.3 FM."], ["66.1", "எனக்கு ராகம் கேட்டிருக்கீங்க அண்ணா உங்க ஆர்ஜே கலக்கல் கல்யாணி. இந்தாடா பிஸ்கட் எடுத்துக்க. பிஸ்கட்லாம் வாங்கல. நாளைக்கு தான் உங்க பர்த்டேல ட்ரீட் வச்சிருக்கேன். சிகரெட்லாம் எப்படா குடிக்கிறீங்க? அந்த டப்பால போட்டிருக்க போட்டோவை பார்த்து கூடடா உங்களுக்கு குடிக்க தோணுது."], ["89.8", "தெரிஞ்சுதான் தொலைங்கல.\nஉனக்கு என்னடா? இன்னைக்கு கூட தான் மேனேஜ்மென்ட்ல இருந்தேன்டா. நான் கேக்குறேன்.\nகாலையில பாருடா.\nஒரு ஹீரோயின் மாதிரி இருக்குடா.\nமெடிக்கல் ஷாப்ப போய் டேப்லெட் வாங்கிட்டு வந்துடறேன். சரி போயிட்டு வா."], ["104.3", "Hello."], ["119.2", "ஹலோ எஃப்எம் 106.4. ஏய் தலை ரொம்ப வலிக்கிற மாதிரி இருக்குடா. சரி இப்ப ரெஸ்ட் எடு நாளைக்கு பார்க்கலாம்."], ["191.1", "என்னடா ஆச்சு? நைட்ல இருந்து ஒரே காய்ச்சல் தான் இருக்குடா. என்னடா உடம்பு இப்படி சுடுது? என் உடம்பு வேற ரொம்ப வலிக்குதுடா. சரி வாடா ஹாஸ்பிடல் போலாம் கிளம்பு."], ["213.8", "பார்த்து பொறுமையாக எழுந்துடுறா."], ["232.7", "என் ஃப்ரெண்டுக்கு என்னாச்சு டாக்டர்?"], ["256.8", "லேட்டஸ்ட் லேப் அனுப்பிச்சிருக்கோம், ரிசல்ட் வரட்டும்.\nஎதனால டாக்டர் இது மாதிரி வருது?\nநீங்க தூக்கி போடுற கொட்டாங்குச்சி அப்புறம் சாக்கடையில தேங்கி நிக்கிற தண்ணில உற்பத்தி ஆகுற கொசு தான் வந்து மலேரியா, டெங்கு இந்த மாதிரி நோய்கள் எல்லாம் பரவிட்டு இருக்கு.\nஇப்ப ஏதாவது உங்களுக்கு வந்து காய்ச்சல் வந்துச்சுன்னா நீங்க டைரக்டா மெடிக்கல் ஷாப் போய் மாத்திரை வாங்காதீங்க.\nடாக்டர் வந்து கன்சல்ட் பண்ணுங்க.\nஇதனால அல்சர், கிட்னி ஃபெயிலியர் அந்த மாதிரி டிசீஸ் எல்லாம் வரும்.\nஇதுக்காக தான் கம்யூனிட்டி மெடிசின் டிபார்ட்மெண்ட்ல இருக்க டாக்டர்..."], ["281.8", "வந்து ஃபீல்ட் விசிட் போய் அங்க இருக்கிற பப்ளிக்லாம் அவேர்னஸ் கிரியேட் பண்றாங்க சார்."], ["300.7", "ਖਾਣਾ ਵਾ।"], ["343.2", "Hello."], ["367.6", "என்ன மச்சான்ச்சு?\nஎன்னன்னே தெரியலடா. நைட் ஃபுல்லா இருமிட்டே இருந்தான். காய்ச்சல் வேற இருந்துச்சு. இங்க கூட்டிட்டு வந்தோம் உடனே அட்மிட் பண்ண சொல்லிட்டாங்க.\nஎன்ன சார் டாக்டர்?\nஇவருக்கு டிபிங்க."], ["391.6", "டாக்டர் இவனுக்கு சிகரெட் தண்ணின்னு எந்த கெட்ட பழக்கமும் இல்ல அப்புறம் எப்படி?\nஇவர்தான் ஸ்மோக் பண்ணனும்னு அவசியம் இல்லங்க. ஸ்மோக் பண்ணும்போது பக்கத்துல இருந்தாலே போதும்.\nடாக்டர் இந்த மாதிரி இதுக்கு முன்னாடி யாருக்காச்சும் வந்திருக்கா?\nநிறைய பேருக்கு வந்திருக்குங்க. எங்க ஊர்ல கூட ஒருத்தர் 20 வருஷமா டீ கடை வச்சிட்டு இருந்தாரு. அவருக்கும் ஆனா எந்த கெட்ட பழக்கமும் இல்ல. ஆனா அவருக்கும் இந்த மாதிரி பிரச்சனைகள் இருக்கு செகண்ட் ஹேண்ட் ஸ்மோக்கிங்னால.\nசெகண்ட் ஹேண்ட் ஸ்மோக்கிங்னா என்னங்க டாக்டர்?\nமத்தவங்க ஸ்மோக் பண்ணும்போது அவங்க சிகரெட்ல இருந்து வர..."], ["416.6", "புகை இருக்குல்லங்க, அத நம்ம சுவாசிச்சோம்னா, அதனால வர விளைவுல தான் செகண்ட் ஹேண்ட்ஸ் ஓகே.\nஇவ்ளோ நேரம் சொன்னேன்லங்க, ஒரு டீ கடைக்காரர் வரீங்க பாருங்க.\nநீங்க உங்களுக்குள்ள தெரிஞ்ச டிரஸ் அந்த மாதிரி நிறைய விஷயம் ஷேர் பண்றீங்கல்லங்க, ஆனா உங்களுக்கே தெரியாம நீங்க நிறைய நோய்களை பரப்புறீங்க, பாத்துருந்தீங்க."], ["436.2", "தெரியல என்னாச்சு? டாக்டர் கூப்பிடுங்க. டாக்டர். சாரி இறந்துட்டாங்க."], ["454.0", "Time of death 11:49 PM."], ["494.5", "அம்மா அம்மா நீ எந்த அம்மா உன்ன விட்டா எனக்கு ஆறு அம்மா நீ அட்டென்ட் பண்ற ஹலோ."], ["507.9", "ஹாப்பி பர்த்டேப்பா, நீ ரொம்ப நாளா கேட்டுட்டு இருந்த பைக் உங்க அப்பா வாங்கிட்டாரு. நாளைக்கு நானும் உங்க அப்பாவும் உன்ன பாக்க வரோம். அவங்க வீட்டுக்கு சொல்லிடலாம்டா. ஆமாண்டா, வாங்க போய் ஆக வேண்டிய வேலைய பாக்கலாம்."], ["543.0", "Stop smoking. Stop smoking. Stop smoking. Stop smoking. Hindu video paathuttu."], ["568.0", "Like pannalainna anti Indian. Share pannalainna anti Indian. Comment pannalainna you are anti Indian. Subscribe pannalainna anti Indian. Bell symbol amukkalainna anti Indian. Idhai download panni vera channel-la potta anti Indian."]], "screen": [["0.0", "other", "HEALTH ADVISORY"], ["0.0", "warning", "SMOKING CAUSE CANCER - SMOKING KILLS! / புகை பிடிப்பது புற்று நோயை உண்டாக்கும் மற்றும் உயிரை கொல்லும்"], ["0.0", "warning", "LIQUOR DRINKING IS INJURIOUS TO HEALTH / மது அருந்துதல் உடல்நலத்திற்கு கேடுவிளைவிப்பதாகும்"], ["19.3", "credit", "MEDIA PARTNER"], ["19.3", "brand", "BE LIKE DOC"], ["25.8", "credit", "GOVT, SIVAGANGAI MEDICAL COLLEGE & HOSPITAL"], ["32.2", "brand", "MIDDLE BENCHERS"], ["58.0", "other", "06:30 PM"], ["496.2", "other", "12:00 AM"], ["515.5", "tagline", "Each cigarette reduces 11 minutes of your lifetime"], ["515.5", "tagline", "Think before you smoke the next one."], ["541.3", "tagline", "STOP SMOKING"], ["547.7", "credit", "DR. JERALD MAJELLAH"], ["547.7", "credit", "DEPT. OF GENERAL MEDICINE"], ["560.6", "credit", "MARIRAJ"], ["560.6", "credit", "AJITH KUMAR"], ["567.1", "brand", "BE LIKE DOC"]]}, {"id": "B_0028", "video": "videos/B_0028.mp4", "dur": "unknown", "cat": "tobacco", "brand":
